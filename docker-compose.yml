services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      NODE_ENV: production
      PORT: "3001"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in OpenShip}"
      TRUST_PROXY: "1"
      FREEAPI_BLOCK_PRIVATE_PROVIDER_URLS: "true"

    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-3001}:3001"

    volumes:
      - freellmapi-data:/app/server/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "fetch('http://127.0.0.1:3001/api/ping').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  freellmapi-data:
